<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Knowledge Studio — Documentation</title>
  <meta name="description" content="Documentation for Open Knowledge Studio — a zero-dependency, browser-native, 12-agent A2A platform.">
  <meta name="keywords" content="open knowledge studio, a2a agents, documentation">
  <meta property="og:title" content="Open Knowledge Studio — Documentation">
  <meta property="og:description" content="Zero-dependency, browser-native, 12-agent A2A platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zsdotcom.github.io/zs-oks/">
  <link rel="alternate" type="text/plain" href="llms.txt" title="LLM documentation index">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a2e'/%3E%3Cpath d='M8 10c0-2 2-4 4-4h8c2 0 4 2 4 4v12c0 2-2 4-4 4h-8c-2 0-4-2-4-4V10z' stroke='%234f46e5' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='16' cy='14' r='3' fill='%234f46e5'/%3E%3Cpath d='M12 20h8' stroke='%234f46e5' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M13 23h6' stroke='%234f46e5' stroke-width='1.5' stroke-linecap='round' opacity='0.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .sidebar .app-name-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      text-decoration: none;
      color: #8B5CF6 !important;
    }
    .sidebar .app-name-link .logo-svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .sidebar .app-name-link .logo-text {
      line-height: 1.2;
    }
    .sidebar .app-name-link .logo-sub {
      display: block;
      font-size: 0.6em;
      font-weight: 400;
      color: #94a3b8;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <script>
    window.$docsify = {
      basePath: '/',
      homepage: 'index.md',
      loadSidebar: '_sidebar.md',
      loadNavbar: '_navbar.md',
      coverpage: '_coverpage.md',
      name: '',
      repo: 'https://github.com/zsdotcom/zs-oks',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results',
        depth: 4,
      },
      autoHeader: true,
      formatUpdated: '{YYYY}-{MM}-{DD}',
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            var link = document.querySelector('.sidebar .app-name-link');
            if (link && !link.querySelector('.logo-svg')) {
              link.innerHTML =
                '<svg class="logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<rect width="32" height="32" rx="6" fill="#1a1a2e"/>' +
                '<path d="M8 10c0-2 2-4 4-4h8c2 0 4 2 4 4v12c0 2-2 4-4 4h-8c-2 0-4-2-4-4V10z" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>' +
                '<circle cx="16" cy="14" r="3" fill="#8B5CF6"/>' +
                '<path d="M12 20h8" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>' +
                '<path d="M13 23h6" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>' +
                '</svg>' +
                '<span class="logo-text">Open Knowledge Studio<span class="logo-sub">Documentation</span></span>';
            }
          });
        },
      ],
    };
  </script>
</body>
</html>
