<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Knowledge Studio — Documentation</title>
  <meta name="description" content="Documentation for Open Knowledge Studio — a zero-dependency, browser-native, 12-agent A2A platform.">
  <meta property="og:title" content="Open Knowledge Studio — Documentation">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zsdotcom.github.io/zs-oks/">
  <link rel="alternate" type="text/plain" href="llms.txt" title="LLM documentation index">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .sidebar .app-name-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      text-decoration: none;
      color: var(--brand) !important;
      padding: 0.75rem;
    }
    .sidebar .app-name-link .logo-svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .sidebar .app-name-link .logo-text {
      line-height: 1.2;
    }
    .sidebar .app-name-link .logo-sub {
      display: block;
      font-size: 0.65em;
      font-weight: 400;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="sidebar-chevron-right sidebar-group-underline">
  <div id="app"></div>

  <script>
    window.$docsify = {
      basePath: '/zs-oks/',
      homepage: 'index.md',
      loadSidebar: '_sidebar.md',
      loadNavbar: '_navbar.md',
      coverpage: '_coverpage.md',
      name: '<span class="app-name-link"><svg class="logo-svg" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="6" fill="#1a1a2e"/><path d="M8 10c0-2 2-4 4-4h8c2 0 4 2 4 4v12c0 2-2 4-4 4h-8c-2 0-4-2-4-4V10z" stroke="#8B5CF6" stroke-width="1.5" fill="none"/><circle cx="16" cy="14" r="3" fill="#8B5CF6"/><path d="M12 20h8" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/><path d="M13 23h6" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></svg><span class="logo-text">Open Knowledge Studio<span class="logo-sub">Documentation</span></span></span>',
      repo: 'https://github.com/zsdotcom/zs-oks',
      auto2top: true,
      autoHeader: true,
      formatUpdated: '{YYYY}-{MM}-{DD}',
      maxLevel: 4,
      notFoundPage: '404.md',
      search: { maxAge: 86400000, paths: 'auto', placeholder: 'Search docs...', noData: 'No results', depth: 4 },
      pwa: {
        serviceWorker: 'sw.js',
        update: 'sw:update',
        installed: 'sw:installed'
      },
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            var pagePath = vm.route.path;
            if (pagePath === '/' || pagePath === '') return html;
            var footer = '<hr style="margin-top:3rem;border:none;border-top:1px solid var(--border);">';
            footer += '<div style="text-align:center;padding:1rem 0;font-size:0.8125rem;color:var(--text-muted);">';
            footer += 'Open Knowledge Studio v2.0 &mdash; <a href="https://github.com/zsdotcom/zs-oks" style="color:var(--brand);">GitHub</a> &middot; ';
            footer += '<a href="project/000-overview.md" style="color:var(--brand);">About</a> &middot; ';
            footer += '<a href="changelog/000-changelog.md" style="color:var(--brand);">Changelog</a>';
            footer += '<br><span style="font-size:0.75rem;">MIT License &mdash; Built by Mohammad Ariful Islam at ZarishSphere Foundation</span>';
            footer += '</div>';
            return html + footer;
          });
        }
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/lib/plugins/pwa.min.js"></script>
</body>
</html>
