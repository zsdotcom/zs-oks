<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Open Knowledge Studio — Zero-dependency, browser-native, 12-agent A2A AI platform documentation.">
  <meta name="theme-color" content="#8B5CF6">
  <meta property="og:title" content="Open Knowledge Studio Docs">
  <meta property="og:description" content="Zero-dependency · Browser-native · 12-Agent A2A Platform">
  <meta property="og:color" content="#8B5CF6">
  <title>Open Knowledge Studio — Docs</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Open Knowledge Studio',
      repo: 'https://github.com/zsdotcom/zs-oks',
      logo: '',
      basePath: '/',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      subMaxLevel: 3,
      auto2top: true,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      search: {
        maxLevel: 4,
        placeholder: 'Search documentation...',
        noData: 'No results found for',
        paths: 'auto',
        depth: 4,
        hideOtherSidebarContent: false,
        namespace: 'oks-docs',
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true,
        previousText: 'Previous',
        nextText: 'Next',
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied',
      },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            const toggle = document.getElementById('theme-toggle');
            if (toggle) {
              toggle.onclick = function (e) {
                e.preventDefault();
                document.body.classList.toggle('theme-light');
                document.body.classList.toggle('theme-dark');
                localStorage.setItem('docs-theme',
                  document.body.classList.contains('theme-light') ? 'light' : 'dark'
                );
              };
            }
            const saved = localStorage.getItem('docs-theme');
            if (saved === 'light') {
              document.body.classList.remove('theme-dark');
              document.body.classList.add('theme-light');
            } else {
              document.body.classList.remove('theme-light');
              document.body.classList.add('theme-dark');
            }
          });
        },
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.6.3/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
</body>
</html>
