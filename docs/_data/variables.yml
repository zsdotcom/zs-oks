# Open Knowledge Studio — Shared Project Variables
# Usage: referenced by all documentation files for consistency.
# These define the canonical project identity.

project:
  name: "Open Knowledge Studio"
  short_name: "OKS"
  tagline: "Zero-dependency · Browser-native · 12-Agent A2A Platform"
  version: "2.0.0"
  description: "A private AI research laboratory in your browser — 12 specialized agents collaborate on your work, all data stays local, zero backend required."

foundation:
  name: "ZarishSphere Foundation"
  url: "https://zarishsphere.com"

author:
