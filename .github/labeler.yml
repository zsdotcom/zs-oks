# PR Labeler Configuration — ZUSS Compliant
# https://github.com/actions/labeler

app:
  - app/**/*
docs:
  - docs/**/*
infra:
  - infrastructure/**/*
  - .github/workflows/**/*
tests:
  - tests/**/*
config:
  - .config/**/*
  - package.json
  - tsconfig.json
  - vite.config.ts
  - opencode.jsonc
meta:
  - README.md
  - AGENTS.md
  - LICENSE
  - SECURITY.md
  - PLAN.md
scripts:
  - scripts/**/*
