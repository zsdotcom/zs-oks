version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Dhaka'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      - dependency-name: 'react'
        versions: ['>=20.0.0']
      - dependency-name: 'react-dom'
        versions: ['>=20.0.0']
    commit-message:
      prefix: 'chore'
      include: 'scope'
    reviewers:
      - 'zsdotcom/codeandbrain'
      - 'zsdotcom/devopsariful'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Dhaka'
    open-pull-requests-limit: 5
    labels:
      - 'ci'
      - 'automated'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    reviewers:
      - 'zsdotcom/devopsariful'
      - 'zsdotcom/codeandbrain'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore'
      include: 'scope'
