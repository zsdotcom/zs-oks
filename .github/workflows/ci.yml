name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.workspace/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'

jobs:
  typecheck-and-test:
    name: TypeCheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: ./.github/actions/setup-node
        with:
          install-playwright: 'true'
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: ./.github/actions/setup-node
      - name: Build with analysis
        run: npm run analyze
      - name: Upload bundle stats
        uses: actions/upload-artifact@v7
        with:
          name: bundle-stats
          path: dist/stats.html
          retention-days: 30
