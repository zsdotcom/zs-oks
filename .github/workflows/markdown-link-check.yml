name: Check Markdown Links

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'mlc_config.json'
      - '.github/workflows/markdown-link-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'mlc_config.json'
      - '.github/workflows/markdown-link-check.yml'
  schedule:
    # Weekly: Sunday 6 AM UTC — catch external link rot
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  markdown-link-check:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check all markdown links
        uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: 'mlc_config.json'
          folder-path: 'docs, .'
          file-path: './README.md, ./AGENTS.md'
          max-depth: -1
