name: Bug Report
description: Report a bug to help us improve
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Before filing, please check that a similar issue doesn't already exist.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: This project is governed by the MIT license and community guidelines.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true

  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear, concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Please complete the following information.
      placeholder: |
        - Browser: [e.g. Chrome 120, Firefox 121]
        - OS: [e.g. Windows 11, macOS 14, Ubuntu 24.04]
        - Version: [e.g. v2.0.0]

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or logs about the problem here.
