name: 'Setup Node.js'
description: 'Checkout, install Node, cache deps, install npm packages'
inputs:
  node-version-file:
    description: 'Node version file path'
    required: false
    default: '.nvmrc'
  install-playwright:
    description: 'Install Playwright browsers'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: 'npm'
    - run: npm ci
      shell: bash
    - run: npx playwright install chromium
      shell: bash
      if: ${{ inputs.install-playwright == 'true' }}
